name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # No instalar los hooks de Husky en el runner
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm se toma del campo packageManager del package.json raíz
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests
        run: pnpm --filter backend test

      - name: Build del backend
        run: pnpm --filter backend build
